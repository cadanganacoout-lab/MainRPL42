<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem("xirpl1-theme");
          var theme = savedTheme === "light" || savedTheme === "dark" ? savedTheme : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <title>Beranda — Kelas XI RPL</title>

    <meta name="theme-color" content="#f0e5ca" media="(prefers-color-scheme: light)" />
    <meta property="og:title" content="Kelas XI RPL — SMK PGRI 2 Ponorogo" />
    <meta property="og:description" content="Platform informasi kelas XI RPL: jadwal pelajaran, piket harian, galeri, video, dan profil siswa." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="id_ID" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="./asset/logo/favicon.ico" sizes="any" />
